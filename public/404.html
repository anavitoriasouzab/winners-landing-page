<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada · Winners Hamburgueria</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0e0b0a">
  <!-- A 404 pode aparecer em qualquer endereço, então os caminhos precisam de uma base fixa:
       - Live Server ou arquivo aberto direto: a pasta ".../public/";
       - GitHub Pages de projeto (usuario.github.io/repositorio/): "/repositorio/";
       - domínio próprio e localhost: a raiz "/". -->
  <script>
    (function () {
      var p = location.pathname, i = p.indexOf('/public/'), base = '/';
      if (i >= 0) base = p.slice(0, i + 8);
      else if (/\.github\.io$/.test(location.hostname) && p.split('/')[1]) base = '/' + p.split('/')[1] + '/';
      document.write('<base href="' + base + '">');
    })();
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="img/brand/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
