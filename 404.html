<head>

  <!-- 404 da raiz do repositório no GitHub Pages: leva para a 404 do site (public/404.html). -->
  <title>Página não encontrada · Winners Hamburgueria</title>
  <meta name="robots" content="noindex">
  <script>
    (function () {
      var seg = location.pathname.split('/')[1];
      var base = /\.github\.io$/.test(location.hostname) && seg ? '/' + seg + '/' : '/';
      location.replace(base + 'public/404.html');
    })();
  </script>
